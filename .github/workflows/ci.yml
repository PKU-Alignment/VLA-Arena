name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          df -h

      - name: Set up Conda (Python 3.11)
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: '3.11'
          activate-environment: vla-arena
          auto-update-conda: true

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install isort black ruff flake8 flake8-bugbear flake8-comprehensions flake8-docstrings flake8-pyi flake8-simplify pylint pyenchant
        shell: bash -l {0}

      - name: Check with pylint
        run: |
          make pylint
        continue-on-error: true
        shell: bash -l {0}

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Conda (Python 3.11)
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: '3.11'
          activate-environment: vla-arena
          auto-update-conda: true

      - name: Free disk space (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          df -h

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libgl1 \
            libglew-dev \
            libosmesa6-dev \
            libglfw3 \
            patchelf

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install glfw3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Install without optional heavy dependencies for CI
          pip install -e .
        shell: bash -l {0}

      - name: Run tests
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            export MUJOCO_GL=egl
          fi
          make test
        shell: bash -l {0}

      - name: Upload coverage reports
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          file: ./tests/coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  build:
    name: Build Package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Conda (Python 3.11)
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: '3.11'
          activate-environment: vla-arena
          auto-update-conda: true

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools
        shell: bash -l {0}

      - name: Build package
        run: |
          make build
        shell: bash -l {0}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
